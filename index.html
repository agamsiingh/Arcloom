<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f6f3ee">
  <meta name="description" content="ARCLOOM — a minimalist arrow-weaving puzzle. Launch every arrow off the loom in the right order.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>ARCLOOM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="app">
    <section class="screen" id="screen-home"></section>
    <section class="screen" id="screen-levels"></section>
    <section class="screen" id="screen-game"></section>
    <section class="screen" id="screen-daily"></section>
    <section class="screen" id="screen-trophies"></section>
    <section class="screen" id="screen-settings"></section>
    <section class="screen" id="screen-shop"></section>
  </div>
  <div id="boot" class="boot">ARCLOOM</div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>ARCLOOM needs JavaScript to run.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
